      <rect x="38.5" y="10" width="4.5" height="84" fill="#000"/>
      <rect x="57"   y="10" width="4.5" height="84" fill="#000"/>
      <rect x="14" y="36.5" width="72" height="4.5" fill="#000"/>
      <rect x="14" y="55"   width="72" height="4.5" fill="#000"/>
    </mask>
  </defs>
  <rect width="100" height="100" rx="22" fill="#ffffff"/>
  <rect width="100" height="100" mask="url(#grid)" fill="#000000"/>
</svg>
